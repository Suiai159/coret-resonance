name: Windows desktop
on:
  push:
    branches: [main, windows, windows-learning]
  pull_request:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Install
        run: python -m pip install -r requirements-build.txt
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Source GUI smoke test
        run: python main.py --smoke-test outputs/source-smoke
      - name: Build Windows package
        run: python tools/build_windows.py
      - name: Packaged GUI and offline QC checks (Unicode path)
        run: python tools/check_windows_package.py --output "outputs/Windows 验证"
      - uses: actions/upload-artifact@v4
        with:
          name: CoreT-Desktop-Windows-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-evidence
          path: outputs/
